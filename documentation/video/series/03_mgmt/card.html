<!doctype html>
<html><head><meta charset="utf-8"><title>Hendrix QMS</title>
<style>
:root{--gold:#d4af37;--gold2:#f0d78a;--ink:#0a0a0a;--fg:#f3efe4;--mut:#9a9488}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ink);color:var(--fg);font-family:Inter,'Inter Display',sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse 70% 60% at 50% 38%,rgba(212,175,55,.13),rgba(212,175,55,0) 70%),linear-gradient(180deg,#0d0d0c,#070707)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{display:flex;align-items:center;gap:26px;opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease}
.logo.on{opacity:1;transform:none}
.logo svg{width:112px;height:112px}
.logo svg polygon,.logo svg path{stroke-dasharray:140;stroke-dashoffset:140;transition:stroke-dashoffset 1.8s ease .2s}
.logo.on svg polygon,.logo.on svg path{stroke-dashoffset:0}
.word b{display:block;font-weight:700;font-size:62px;letter-spacing:.32em;color:var(--gold);line-height:1}
.word span{display:block;margin-top:12px;font-size:19px;letter-spacing:.62em;color:#cfc8b6}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:44px 0 34px;transition:width 1.4s ease .6s}
.rule.on{width:620px}
h1{font-size:44px;font-weight:600;letter-spacing:-.01em;opacity:0;transition:opacity 1s ease 1s;text-align:center}
h1.on{opacity:1}
p.sub{margin-top:16px;font-size:22px;color:var(--mut);opacity:0;transition:opacity 1s ease 1.4s;text-align:center}
p.sub.on{opacity:1}
.list{margin-top:40px;display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:14px 38px}
.it{display:flex;align-items:center;gap:14px;font-size:21px;color:#e8e2d2;opacity:0;transform:translateX(-10px);transition:opacity .6s ease,transform .6s ease}
.it.on{opacity:1;transform:none}
.it i{font-style:normal;flex:none;width:34px;height:34px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold);font-weight:600}
.kick{margin-top:0;font-size:19px;letter-spacing:.26em;color:var(--gold2);text-transform:uppercase;opacity:0;transition:opacity 1s ease .8s;margin-bottom:18px}.kick.on{opacity:1}
.next{margin-top:8px;font-size:30px;color:var(--fg);opacity:0;transition:opacity 1s ease}.next.on{opacity:1}.next em{font-style:normal;color:var(--gold)}
.foot{position:absolute;top:44px;font-size:15px;letter-spacing:.3em;color:#6f6a60;opacity:0;transition:opacity 1s ease 1.8s}
.foot.on{opacity:1}
.book{margin-top:38px;display:flex;gap:22px;align-items:center;border:1px solid rgba(212,175,55,.45);border-radius:14px;padding:22px 30px;background:rgba(20,18,12,.7);opacity:0;transition:opacity 1s ease}
.book.on{opacity:1}
.book svg{width:46px;height:46px;flex:none}
.book b{display:block;font-size:24px;color:var(--gold2);font-weight:600}
.book span{display:block;font-size:17px;color:var(--mut);margin-top:6px}
.thanks{margin-top:42px;font-size:40px;font-weight:600;color:var(--gold);opacity:0;transition:opacity 1.2s ease}
.thanks.on{opacity:1}
</style></head>
<body>
<div class="wrap">
  <div class="logo" id="logo">
    <svg viewBox="0 0 40 40" fill="none" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11"/><path d="M13 12v16M27 12v16M13 20h14"/>
    </svg>
    <div class="word"><b>HENDRIX</b><span>QUALITY MANAGEMENT</span></div>
  </div>
  <div class="rule" id="rule"></div>
  <div class="kick" id="kick"></div>
  <h1 id="h1"></h1>
  <div class="next" id="next" style="display:none"></div>
  <p class="sub" id="sub"></p>
  <div class="list" id="list"></div>
  <div class="book" id="book" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7h7M8 10h5"/></svg>
    <div><b>Hendrix QMS User Manual</b><span>Full details in the User Manual, Chapter 4</span></div>
  </div>
  <div class="thanks" id="thanks">Thank you</div>
  <div class="foot" id="foot">ONE QUALITY SYSTEM &middot; EVERY LICENSE &middot; BUILT ON CSQ</div>
</div>
<script>
const mode = location.pathname.includes('end') ? 'end' : 'title';
const $ = id => document.getElementById(id);
const ITEMS = ['HACCP','Risk Register','Change Control','Org Chart','Quality Objectives','Management Review','Verification Schedule'];
$('kick').textContent = 'Hendrix QMS training · Video 03';
if (mode === 'title') {
  $('h1').textContent = 'HACCP and the management system';
  $('sub').textContent = 'The food safety plan and the CSQ Level 3 management tools, recorded in the live app';
} else {
  $('h1').textContent = 'HACCP and the management system';
  $('sub').style.display = 'none'; $('foot').style.display = 'none';
  $('next').style.display = 'block'; $('next').innerHTML = 'Next: <em>Video 04 \u00b7 Suppliers, materials and traceability</em>';
  $('book').style.display = 'flex'; $('book').style.opacity = 0;
}
ITEMS.forEach((t, i) => { const d = document.createElement('div'); d.className = 'it'; d.innerHTML = '<i>' + (i + 1) + '</i><span>' + t + '</span>'; $('list').appendChild(d); });
if (mode === 'end') $('list').style.display = 'none';
window.step = function (n) {
  if (n === 0) { ['logo', 'rule', 'kick', 'h1', 'sub', 'foot'].forEach(k => $(k).classList.add('on')); }
  if (n === 1 && mode === 'title') { [...document.querySelectorAll('.it')].forEach((e, i) => setTimeout(() => e.classList.add('on'), 300 + i * 650)); }
  if (n === 1 && mode === 'end') { $('next').classList.add('on'); setTimeout(() => { $('book').style.opacity = ''; $('book').classList.add('on'); }, 1600); }
  if (n === 2) { $('thanks').classList.add('on'); }
};
if (mode === 'end') $('thanks').style.display = 'block'; else $('thanks').style.display = 'none';
</script>
</body></html>
